<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(0,234,255,.08),
            transparent 45%
        ),
        radial-gradient(
            circle at 0% 100%,
            rgba(0,100,255,.06),
            transparent 35%
        ),
        #020405;

    color:#fff;

    font-family:
        "Barlow Condensed",
        Arial,
        sans-serif;

    overflow-x:hidden;

    padding:25px;
}


/* =========================================================
   CUSTOM CURSOR
========================================================= */

html,
body{
    cursor:url('cursor.png'), auto;
}

a,
button,
input,
textarea,
select{
    cursor:url('cursor.png'), pointer !important;
}


/* =========================================================
   PARTICLES / STARS
========================================================= */

.stars{
    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:0;
}

.stars span{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 5px #00eaff,
        0 0 10px rgba(0,234,255,.6);

    animation:
        twinkle 3s ease-in-out infinite;
}


/* POSISI PARTICLE */

.stars span:nth-child(1){
    left:8%;
    top:15%;
    animation-delay:.2s;
}

.stars span:nth-child(2){
    left:22%;
    top:65%;
    animation-delay:1.1s;
}

.stars span:nth-child(3){
    left:37%;
    top:25%;
    animation-delay:2s;
}

.stars span:nth-child(4){
    left:48%;
    top:78%;
    animation-delay:.5s;
}

.stars span:nth-child(5){
    left:61%;
    top:12%;
    animation-delay:1.6s;
}

.stars span:nth-child(6){
    left:72%;
    top:43%;
    animation-delay:2.4s;
}

.stars span:nth-child(7){
    left:84%;
    top:22%;
    animation-delay:.8s;
}

.stars span:nth-child(8){
    left:96%;
    top:70%;
    animation-delay:1.8s;
}

.stars span:nth-child(9){
    left:93%;
    top:49%;
    animation-delay:2.2s;
}

.stars span:nth-child(10){
    left:54%;
    top:52%;
    animation-delay:.9s;
}

.stars span:nth-child(11){
    left:12%;
    top:46%;
    animation-delay:1.4s;
}

.stars span:nth-child(12){
    left:88%;
    top:81%;
    animation-delay:.3s;
}


@keyframes twinkle{

    0%,
    100%{
        opacity:.2;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.8);
    }

}


/* =========================================================
   MAIN PANEL
========================================================= */

.glass-panel{

    position:relative;

    width:100%;

    max-width:1450px;

    margin:auto;

    padding:25px;

    background:
        linear-gradient(
            145deg,
            rgba(12,17,21,.96),
            rgba(3,6,8,.94)
        );

    border:
        1px solid
        rgba(0,234,255,.22);

    border-radius:22px;

    box-shadow:
        0 35px 100px rgba(0,0,0,.9),
        0 0 50px rgba(0,234,255,.06);

    overflow:hidden;

    z-index:1;
}


/* =========================================================
   ANIMATED BORDER
========================================================= */

.glass-panel::before{

    content:"";

    position:absolute;

    inset:0;

    padding:1px;

    border-radius:22px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,234,255,.9),
            transparent,
            rgba(0,150,255,.8),
            transparent
        );

    background-size:300% 100%;

    animation:
        borderRun 5s linear infinite;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;

    mask-composite:exclude;

    pointer-events:none;

    z-index:10;
}


@keyframes borderRun{

    0%{
        background-position:0% 50%;
    }

    100%{
        background-position:300% 50%;
    }

}


/* =========================================================
   VIDEO
========================================================= */

.bg-video-panel{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:.10;

    pointer-events:none;

    z-index:0;

    mix-blend-mode:screen;
}


/* =========================================================
   LIGHT SWEEP
========================================================= */

.glass-panel::after{

    content:"";

    position:absolute;

    top:-100%;

    left:-30%;

    width:18%;

    height:300%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.05),
            rgba(0,234,255,.18),
            rgba(255,255,255,.04),
            transparent
        );

    transform:rotate(18deg);

    animation:
        lightSweep 7s linear infinite;

    pointer-events:none;

    z-index:2;
}


@keyframes lightSweep{

    0%{
        left:-40%;
    }

    100%{
        left:140%;
    }

}


/* =========================================================
   CONTENT LAYER
========================================================= */

.top-row,
.ticker,
.menu-container{

    position:relative;

    z-index:5;

}


/* =========================================================
   HEADER
========================================================= */

.top-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-links{

    display:flex;

    align-items:center;

    gap:10px;
}


.btn-back{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:
        10px
        18px;

    color:#dfffff;

    background:
        rgba(0,234,255,.05);

    border:
        1px solid
        rgba(0,234,255,.25);

    border-radius:8px;

    text-decoration:none;

    font-size:13px;

    font-weight:900;

    letter-spacing:1px;

    transition:.25s;
}


.btn-back:hover{

    color:#fff;

    border-color:#00eaff;

    background:
        rgba(0,234,255,.18);

    transform:
        translateY(-3px);

    box-shadow:
        0 0 12px
        rgba(0,234,255,.3),

        0 0 25px
        rgba(0,234,255,.1);
}


/* =========================================================
   CLOCK
========================================================= */

#live-time{

    padding:
        10px
        18px;

    color:#fff;

    font-family:
        "Orbitron",
        sans-serif;

    font-size:11px;

    letter-spacing:1px;

    background:
        rgba(0,0,0,.55);

    border:
        1px solid
        rgba(0,234,255,.25);

    border-radius:10px;

    box-shadow:
        inset 0 0 15px
        rgba(0,234,255,.04),

        0 0 15px
        rgba(0,234,255,.05);

    text-shadow:
        0 0 8px
        rgba(0,234,255,.6);
}


/* =========================================================
   TICKER
========================================================= */

.ticker{

    position:relative;

    margin-top:18px;

    padding:
        11px
        15px;

    border-radius:10px;

    overflow:hidden;

    white-space:nowrap;

    background:
        linear-gradient(
            90deg,
            rgba(0,234,255,.08),
            rgba(0,0,0,.6),
            rgba(0,150,255,.06)
        );

    border:
        1px solid
        rgba(0,234,255,.18);

    box-shadow:
        inset 0 0 20px
        rgba(0,234,255,.03),

        0 0 15px
        rgba(0,234,255,.04);
}


/* TICKER LIGHT */

.ticker::before{

    content:"";

    position:absolute;

    top:0;

    left:-100px;

    width:80px;

    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,234,255,.7),
            transparent
        );

    filter:blur(4px);

    animation:
        tickerLight 4s linear infinite;
}


@keyframes tickerLight{

    from{
        left:-100px;
    }

    to{
        left:110%;
    }

}


.ticker span{

    display:inline-block;

    padding-left:100%;

    font-size:14px;

    letter-spacing:1px;

    color:#dffcff;

    text-shadow:
        0 0 8px
        rgba(0,234,255,.4);

    animation:
        scroll 28s linear infinite;
}


@keyframes scroll{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(-100%);
    }

}


/* =========================================================
   TOP MENU
========================================================= */

.menu-container{

    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:10px;

    margin-top:45px;

    padding:
        10px
        0
        5px;
}


/* =========================================================
   BUTTON WRAPPER
========================================================= */

.btn-wrapper{

    position:relative;

    display:inline-block;
}


/* =========================================================
   HOVER LOGO
========================================================= */

.hover-logo{

    position:absolute;

    top:-52px;

    left:50%;

    transform:
        translateX(-50%)
        translateY(12px);

    height:45px;

    width:auto;

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transition:.25s ease;

    filter:
        drop-shadow(
            0 0 8px
            rgba(0,234,255,.65)
        )
        drop-shadow(
            0 0 20px
            rgba(0,234,255,.3)
        );
}


.btn-wrapper:hover .hover-logo{

    opacity:1;

    visibility:visible;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   MENU BUTTON
========================================================= */

.btn-menu{

    position:relative;

    display:inline-block;

    min-width:150px;

    padding:
        14px
        28px;

    border-radius:10px;

    border:
        1px solid
        rgba(0,234,255,.25);

    background:
        rgba(0,0,0,.45);

    color:#dfffff;

    text-decoration:none;

    text-align:center;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:15px;

    font-weight:900;

    letter-spacing:1px;

    transition:.25s;

    overflow:hidden;
}


/* =========================================================
   BUTTON LIGHT
========================================================= */

.btn-menu::before{

    content:"";

    position:absolute;

    top:0;

    left:-120%;

    width:80%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );

    transform:skewX(-20deg);

    transition:.5s;
}


.btn-menu:hover::before{

    left:140%;
}


/* =========================================================
   BUTTON HOVER / ACTIVE
========================================================= */

.btn-wrapper:hover .btn-menu,
.btn-menu.active{

    color:#fff;

    border-style:solid;

    border-color:#00eaff;

    background:
        linear-gradient(
            135deg,
            rgba(0,170,195,.85),
            rgba(0,80,140,.8)
        );

    transform:
        translateY(-3px);

    box-shadow:
        0 0 12px
        rgba(0,234,255,.3),

        0 0 25px
        rgba(0,234,255,.1);

    text-shadow:
        0 0 8px
        rgba(255,255,255,.7);
}


/* =========================================================
   ACTIVE BCA
========================================================= */

.btn-menu.active{

    background:
        linear-gradient(
            135deg,
            #00a8c0,
            #006bff
        );

    box-shadow:
        0 0 15px
        rgba(0,234,255,.35),

        inset 0 0 15px
        rgba(255,255,255,.08);
}


/* =========================================================
   SEPARATOR
========================================================= */

.divider{

    position:relative;

    z-index:5;

    width:100%;

    height:1px;

    margin-top:35px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,234,255,.4),
            transparent
        );

    box-shadow:
        0 0 10px
        rgba(0,234,255,.2);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    body{
        padding:15px;
    }

    .glass-panel{
        padding:18px;
    }

    .btn-menu{

        min-width:105px;

        padding:
            12px
            14px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .top-row{

        flex-direction:column;

        align-items:stretch;
    }

    .back-links{

        justify-content:center;
    }

    #live-time{

        text-align:center;

        font-size:9px;
    }

    .menu-container{

        gap:7px;

        margin-top:35px;
    }

    .btn-menu{

        min-width:95px;

        padding:
            10px
            12px;

        font-size:13px;
    }

    .ticker span{

        font-size:12px;
    }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media(max-width:430px){

    body{
        padding:8px;
    }

    .glass-panel{

        padding:14px;

        border-radius:16px;
    }

    .menu-container{

        display:grid;

        grid-template-columns:
            repeat(2,1fr);

        width:100%;
    }

    .btn-wrapper{

        width:100%;
    }

    .btn-menu{

        width:100%;

        min-width:0;

        font-size:12px;

        padding:
            11px
            5px;
    }

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{

    width:8px;
    height:8px;
}


::-webkit-scrollbar-track{

}

    border-radius:20px;

    box-shadow:
        0 0 8px
        rgba(0,234,255,.5);
}


::-webkit-scrollbar-thumb:hover{

    background:#fff;

}

</style>

</head>

<!-- =======================================================

<script>

function updateClock(){

    const now = new Date();

    const hari = [
        "Minggu",
        "Senin",
        "Selasa",
        "Rabu",
        "Kamis",
        "Jumat",
        "Sabtu"
    ];

    const bulan = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "Mei",
        "Jun",
        "Jul",
        "Agu",
        "Sep",
        "Okt",
        "Nov",
        "Des"
    ];


    const tanggal =
        now.getDate();


    const tahun =
        now.getFullYear();


    const jam =
        String(
            now.getHours()
        ).padStart(2,"0");


    const menit =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const detik =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    document
        .getElementById("live-time")
        .innerText =

        hari[now.getDay()]
        + ", "
        + tanggal
        + " "
        + bulan[now.getMonth()]
        + " "
        + tahun
        + " - "
        + jam
        + ":"
        + menit
        + ":"
        + detik;

}


updateClock();

setInterval(
    updateClock,
    1000
);

</script>
