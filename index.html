<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    cursor:url('cursor.png'),auto;
}

/* =========================
   VIDEO BACKGROUND ASLI
========================= */

.video-bg{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-5;

    /* TANPA BLUR */
    filter:none;

    /* WARNA VIDEO ASLI */
    opacity:1;

    pointer-events:none;
}

/* TIDAK ADA OVERLAY GELAP */
.video-overlay{
    display:none;
}

/* TIDAK ADA VIGNETTE */
.video-vignette{
    display:none;
}

/* =========================
   LOGIN CARD
========================= */

.login-card{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:380px;

    padding:42px 38px;

    border-radius:24px;

    border:1px solid rgba(255,255,255,.30);

    /*
       Card transparan supaya
       background video tetap terlihat
    */
    background:rgba(5,10,19,.35);

    /*
       Tidak blur background
    */
    backdrop-filter:none;
    -webkit-backdrop-filter:none;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.15);

    text-align:center;

    animation:cardAppear .8s ease-out;
}

/* TOP LIGHT */
.login-card::before{
    content:"";

    position:absolute;

    top:-1px;
    left:15%;

    width:70%;
    height:2px;

    border-radius:50%;

    background:linear-gradient(
        90deg,
        transparent,
        #00eaff,
        #8c5cff,
        #00eaff,
        transparent
    );

    box-shadow:
        0 0 10px #00eaff,
        0 0 20px rgba(0,234,255,.6);
}

/* =========================
   LOGO
========================= */

.logo{
    width:76px;
    height:76px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:rgba(0,0,0,.18);

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
        0 0 25px rgba(0,234,255,.15),
        inset 0 0 15px rgba(255,255,255,.05);

    animation:logoPulse 3s ease-in-out infinite;
}

.logo span{
    font-size:32px;

    font-weight:800;

    color:#fff;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(0,234,255,.8);
}

/* =========================
   TITLE
========================= */

h1{
    color:#fff;

    font-size:28px;

    font-weight:800;

    letter-spacing:4px;

    margin-bottom:7px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.7),
        0 0 15px rgba(0,234,255,.25);
}

.subtitle{
    color:#fff;

    font-size:12px;

    font-weight:600;

    letter-spacing:2px;

    margin-bottom:30px;

    text-shadow:
        0 2px 7px rgba(0,0,0,.8);
}

/* =========================
   LOGIN BUTTON
========================= */

.login-button{
    position:relative;

    width:100%;
    height:58px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    overflow:hidden;

    border-radius:14px;

    text-decoration:none;

    color:#fff;

    font-size:15px;

    font-weight:800;

    letter-spacing:2px;

    background:
        linear-gradient(
            100deg,
            #007f96,
            #00cfe8,
            #7357ff
        );

    border:1px solid rgba(255,255,255,.30);

    box-shadow:
        0 10px 30px rgba(0,0,0,.35),
        0 0 20px rgba(0,210,235,.20),
        inset 0 1px 0 rgba(255,255,255,.30);

    transition:
        transform .3s ease,
        box-shadow .3s ease;

    cursor:pointer;
}

/* BUTTON SHINE */
.login-button::before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:80%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.40),
            transparent
        );

    transform:skewX(-20deg);

    animation:shine 3s infinite;
}

.login-button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.45),
        0 0 30px rgba(0,225,255,.35),
        inset 0 1px 0 rgba(255,255,255,.35);
}

.login-button:active{
    transform:translateY(0) scale(.98);
}

.arrow{
    font-size:20px;

    transition:.3s ease;
}

.login-button:hover .arrow{
    transform:translateX(6px);
}

/* =========================
   FOOTER
========================= */

.footer{
    margin-top:24px;

    color:#fff;

    font-size:10px;

    letter-spacing:1.5px;

    text-shadow:
        0 2px 6px rgba(0,0,0,.8);
}

/* =========================
   ANIMATION
========================= */

@keyframes cardAppear{

    from{
        opacity:0;

        transform:
            translate(-50%,-46%)
            scale(.95);
    }

    to{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}

@keyframes logoPulse{

    0%,100%{
        box-shadow:
            0 0 25px rgba(0,234,255,.12),
            inset 0 0 15px rgba(255,255,255,.05);
    }

    50%{
        box-shadow:
            0 0 40px rgba(0,234,255,.30),
            inset 0 0 20px rgba(255,255,255,.08);
    }
}

@keyframes shine{

    0%{
        left:-120%;
    }

    45%,
    100%{
        left:140%;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .login-card{
        width:calc(100% - 32px);

        padding:35px 25px;
    }

    h1{
        font-size:24px;
    }

    .logo{
        width:68px;
        height:68px;
    }

    .subtitle{
        font-size:10px;
    }
}
</style>

</head>

</body>
