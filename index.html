<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOGIN</title>

<link rel="icon" type="image/png" href="ayutogel2.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Poppins',sans-serif;

    cursor:url('cursor.png'),auto;
}

body{
    position:relative;
    background:#000;
}


/* =====================================================
   VIDEO BACKGROUND
===================================================== */

.video-bg{
    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100vh;

    /*
       FILL = TIDAK MEMOTONG VIDEO
       dan tidak melakukan zoom seperti cover
    */
    object-fit:fill;

    object-position:center;

    display:block;

    opacity:1;

    filter:none;

    z-index:1;

    pointer-events:none;
}


/* =====================================================
   TRANSPARENT ATMOSPHERE
   Tidak membuat video blur
===================================================== */

.atmosphere{
    position:fixed;
    inset:0;

    z-index:2;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 50%,
            transparent 25%,
            rgba(0,0,0,.08) 75%,
            rgba(0,0,0,.18) 100%
        );
}


/* =====================================================
   LIGHT BEAM
===================================================== */

.light-beam{
    position:fixed;

    width:160%;
    height:2px;

    left:-30%;
    top:20%;

    z-index:3;

    pointer-events:none;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,238,255,0),
        rgba(0,238,255,.8),
        rgba(255,255,255,.9),
        rgba(0,238,255,.8),
        rgba(0,238,255,0),
        transparent
    );

    box-shadow:
        0 0 15px rgba(0,238,255,.7);

    transform:rotate(-8deg);

    opacity:.35;

    animation:beamMove 8s linear infinite;
}


/* =====================================================
   FLOATING FIRE / EMBERS
===================================================== */

.fire-particles{
    position:fixed;
    inset:0;

    z-index:4;

    pointer-events:none;

    overflow:hidden;
}

.fire{
    position:absolute;

    bottom:-20px;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 5px #fff,
        0 0 10px #ff9d00,
        0 0 18px #ff4500;

    opacity:0;

    animation:fireFloat linear infinite;
}


/* POSITIONS */

.f1{
    left:8%;
    animation-duration:6s;
    animation-delay:1s;
}

.f2{
    left:17%;
    animation-duration:8s;
    animation-delay:3s;
}

.f3{
    left:28%;
    animation-duration:7s;
    animation-delay:1.5s;
}

.f4{
    left:39%;
    animation-duration:9s;
    animation-delay:4s;
}

.f5{
    left:52%;
    animation-duration:6s;
    animation-delay:2s;
}

.f6{
    left:63%;
    animation-duration:8s;
    animation-delay:4.5s;
}

.f7{
    left:73%;
    animation-duration:7s;
    animation-delay:1s;
}

.f8{
    left:84%;
    animation-duration:9s;
    animation-delay:3.5s;
}

.f9{
    left:94%;
    animation-duration:6s;
    animation-delay:2.5s;
}


/* =====================================================
   LIGHT DOTS
===================================================== */

.light-dots{
    position:fixed;
    inset:0;

    z-index:4;

    pointer-events:none;
}

.dot{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #fff,
        0 0 15px #00eaff;

    animation:dotPulse 3s ease-in-out infinite;
}

.d1{
    top:15%;
    left:13%;
    animation-delay:.2s;
}

.d2{
    top:27%;
    left:83%;
    animation-delay:1s;
}

.d3{
    top:71%;
    left:9%;
    animation-delay:1.7s;
}

.d4{
    top:82%;
    left:88%;
    animation-delay:2.2s;
}

.d5{
    top:11%;
    left:57%;
    animation-delay:.7s;
}

.d6{
    top:64%;
    left:76%;
    animation-delay:1.3s;
}


/* =====================================================
   ENERGY RING
===================================================== */

.energy-ring{
    position:fixed;

    left:50%;
    top:50%;

    width:600px;
    height:600px;

    transform:translate(-50%,-50%);

    border:1px solid rgba(0,238,255,.12);

    border-radius:50%;

    z-index:3;

    pointer-events:none;

    animation:ringRotate 18s linear infinite;
}

.energy-ring::before,
.energy-ring::after{
    content:"";

    position:absolute;

    inset:35px;

    border-radius:50%;

    border:1px dashed rgba(255,255,255,.08);
}

.energy-ring::after{
    inset:90px;

    border-color:rgba(0,238,255,.10);
}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card{
    position:absolute;

    z-index:10;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:380px;

    padding:42px 38px;

    border-radius:24px;

    background:rgba(5,10,18,.32);

    border:1px solid rgba(255,255,255,.28);

    /*
       SENGAJA TANPA backdrop-filter
       supaya background tidak blur
    */
    backdrop-filter:none;
    -webkit-backdrop-filter:none;

    box-shadow:
        0 20px 70px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.18);

    text-align:center;

    animation:cardAppear .8s ease-out;
}


/* TOP GLOW */

.login-card::before{
    content:"";

    position:absolute;

    top:-1px;
    left:12%;

    width:76%;
    height:2px;

    border-radius:50%;

    background:linear-gradient(
        90deg,
        transparent,
        #00eaff,
        #fff,
        #8c5cff,
        #00eaff,
        transparent
    );

    box-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(0,234,255,.6);
}


/* BOTTOM GLOW */

.login-card::after{
    content:"";

    position:absolute;

    bottom:-1px;
    left:20%;

    width:60%;
    height:1px;

    background:linear-gradient(
        90deg,
        transparent,
        #00eaff,
        transparent
    );

    box-shadow:
        0 0 12px #00eaff;
}


/* =====================================================
   LOGO
===================================================== */

.logo{
    width:76px;
    height:76px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:rgba(0,0,0,.22);

    border:1px solid rgba(255,255,255,.30);

    box-shadow:
        0 0 25px rgba(0,234,255,.15),
        inset 0 0 20px rgba(255,255,255,.05);

    animation:logoPulse 3s ease-in-out infinite;
}

.logo span{
    font-size:32px;

    font-weight:800;

    color:#fff;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(0,234,255,.8);
}


/* =====================================================
   TITLE
===================================================== */

h1{
    color:#fff;

    font-size:28px;

    font-weight:800;

    letter-spacing:4px;

    margin-bottom:7px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.8),
        0 0 15px rgba(0,234,255,.35);
}

.subtitle{
    color:#fff;

    font-size:12px;

    font-weight:600;

    letter-spacing:2px;

    margin-bottom:30px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.9);
}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-button{
    position:relative;

    width:100%;
    height:58px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    overflow:hidden;

    border-radius:14px;

    text-decoration:none;

    color:#fff;

    font-size:15px;

    font-weight:800;

    letter-spacing:2px;

    background:
        linear-gradient(
            100deg,
            #007f96,
            #00cfe8,
            #7357ff
        );

    border:1px solid rgba(255,255,255,.30);

    box-shadow:
        0 10px 30px rgba(0,0,0,.35),
        0 0 20px rgba(0,210,235,.20),
        inset 0 1px 0 rgba(255,255,255,.30);

    transition:
        transform .3s ease,
        box-shadow .3s ease;

    cursor:pointer;
}


/* SHINE */

.login-button::before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:80%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );

    transform:skewX(-20deg);

    animation:buttonShine 3s infinite;
}


.login-button:hover{
    transform:translateY(-4px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.45),
        0 0 30px rgba(0,225,255,.40);
}


.login-button:active{
    transform:translateY(0) scale(.98);
}


.arrow{
    font-size:20px;

    transition:.3s ease;
}


.login-button:hover .arrow{
    transform:translateX(7px);
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
    margin-top:24px;

    color:#fff;

    font-size:10px;

    letter-spacing:1.5px;

    text-shadow:
        0 2px 7px rgba(0,0,0,.9);
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes cardAppear{

    from{
        opacity:0;

        transform:
            translate(-50%,-46%)
            scale(.94);
    }

    to{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


@keyframes logoPulse{

    0%,100%{
        box-shadow:
            0 0 25px rgba(0,234,255,.12),
            inset 0 0 15px rgba(255,255,255,.05);
    }

    50%{
        box-shadow:
            0 0 45px rgba(0,234,255,.35),
            inset 0 0 20px rgba(255,255,255,.08);
    }
}


@keyframes buttonShine{

    0%{
        left:-120%;
    }

    45%,
    100%{
        left:140%;
    }
}


@keyframes beamMove{

    0%{
        transform:
            translateX(-25%)
            rotate(-8deg);
    }

    50%{
        transform:
            translateX(20%)
            rotate(-8deg);
    }

    100%{
        transform:
            translateX(-25%)
            rotate(-8deg);
    }
}


@keyframes fireFloat{

    0%{
        transform:
            translate(0,20px)
            scale(.5);

        opacity:0;
    }

    15%{
        opacity:.8;
    }

    50%{
        transform:
            translate(25px,-45vh)
            scale(1);
    }

    85%{
        opacity:.6;
    }

    100%{
        transform:
            translate(-20px,-105vh)
            scale(.2);

        opacity:0;
    }
}


@keyframes dotPulse{

    0%,100%{
        opacity:.15;
        transform:scale(.6);
    }

    50%{
        opacity:.9;
        transform:scale(1.5);
    }
}


@keyframes ringRotate{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

    .login-card{
        width:calc(100% - 30px);

        padding:
            35px
            25px;
    }

    h1{
        font-size:24px;
    }

    .subtitle{
        font-size:10px;
    }

    .energy-ring{
        width:420px;
        height:420px;
    }
}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }
}

</style>

</head>
